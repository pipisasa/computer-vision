<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finger Tracking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Finger Tracking</h1>

    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="loading">Loading hand tracking model…</div>
    </div>

    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">Hands</span>
        <span class="hud-value" id="hand-count">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Fingers up</span>
        <span class="hud-value" id="finger-count">–</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Gesture</span>
        <span class="hud-value" id="gesture">–</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">FPS</span>
        <span class="hud-value" id="fps">0</span>
      </div>
    </div>

  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
